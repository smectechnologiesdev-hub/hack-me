# ===========================================================================
# Nginx site config for the Brute-Force Authentication Lab on AWS Lightsail.
# Place at /etc/nginx/sites-available/bruteforce-lab and symlink into
# sites-enabled.  Replace mylab.example.com with your domain.
#
# TLS certificates below assume Let's Encrypt / certbot (see README).  Before
# running certbot you can start with just the HTTP server block.
# ===========================================================================

upstream lab_asgi {
    # gunicorn + uvicorn workers listen here (see the systemd unit).
    server 127.0.0.1:8000;
}

# --- HTTP: redirect everything to HTTPS ------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mylab.example.com;

    # Allow the ACME HTTP-01 challenge through before redirecting.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: proxy to Daphne (HTTP + WebSocket) -----------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mylab.example.com;

    ssl_certificate     /etc/letsencrypt/live/mylab.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mylab.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Keep request bodies small — the training endpoint only needs tiny JSON.
    client_max_body_size 1m;

    # Static files collected by `collectstatic` (WhiteNoise also serves these,
    # but letting Nginx serve them directly is faster).
    location /static/ {
        alias /home/ubuntu/bruteforce-lab/staticfiles/;
        expires 30d;
        access_log off;
    }
    location /media/ {
        alias /home/ubuntu/bruteforce-lab/media/;
        expires 7d;
        access_log off;
    }

    # WebSocket endpoint — must pass the Upgrade headers through to Daphne.
    location /ws/ {
        proxy_pass http://lab_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep long-lived sockets open
    }

    # Everything else -> Django over ASGI.
    location / {
        proxy_pass http://lab_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django uses this to know the original request was HTTPS
        # (SECURE_PROXY_SSL_HEADER in config/settings/prod.py).
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
