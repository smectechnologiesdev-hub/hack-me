# ===========================================================================
# Local / single-host production-like stack:
#   web (Daphne ASGI)  +  PostgreSQL  +  Redis (Channels layer)
#
# For a real AWS Lightsail deployment you would typically front this with the
# host's Nginx + Let's Encrypt (see deploy/ and the README).  This compose file
# is handy for testing the full multi-service setup locally.
# ===========================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab_db}
      POSTGRES_USER: ${POSTGRES_USER:-lab_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab_user}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in your environment or .env}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      DATABASE_URL: postgres://${POSTGRES_USER:-lab_user}:${POSTGRES_PASSWORD:-lab_password}@db:5432/${POSTGRES_DB:-lab_db}
      REDIS_URL: redis://redis:6379/0
      # For local compose over plain HTTP, relax the HTTPS redirect.
      SECURE_SSL_REDIRECT: "False"
    ports:
      - "8000:8000"

volumes:
  pgdata:
