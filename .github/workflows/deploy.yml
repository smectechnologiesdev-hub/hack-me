# ===========================================================================
# CI/CD for the Brute-Force Authentication Training Lab
#
#   test   -> runs on every push & PR to main (Django test suite)
#   deploy -> runs only on push to main, AFTER tests pass:
#             rsync code to the Lightsail server, migrate, collectstatic,
#             and restart the Daphne systemd service.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   LIGHTSAIL_SSH_KEY  - the FULL contents of aws/hacke-me-ssh-key.pem
#   LIGHTSAIL_HOST     - 65.0.134.223
# ===========================================================================
name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Run Django test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          SECRET_KEY: ci-only-secret-not-used-in-production
        run: python manage.py test --verbosity 2

  deploy:
    name: Deploy to Lightsail
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code to server
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='.github' \
            --exclude='.venv' --exclude='venv' \
            --exclude='.env' \
            --exclude='db.sqlite3*' --exclude='test_db.sqlite3*' \
            --exclude='staticfiles' --exclude='media' \
            --exclude='aws' --exclude='*.pem' \
            --exclude='__pycache__' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ ubuntu@${{ secrets.LIGHTSAIL_HOST }}:/home/ubuntu/bruteforce-lab/

      - name: Migrate, collect static, restart service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ubuntu@${{ secrets.LIGHTSAIL_HOST }} 'bash -s' <<'REMOTE'
          set -e
          cd /home/ubuntu/bruteforce-lab
          . .venv/bin/activate
          pip install -r requirements.txt -q
          python manage.py migrate --noinput
          # Ensure 500 unique challenge targets exist and every student has one.
          # Idempotent: only creates the shortfall, never deletes or duplicates.
          python manage.py provision_challenge --count 500 \
            --wordlist tools/wordlist.txt --min-rank 50 --max-rank 1100 --assign
          python manage.py collectstatic --noinput
          sudo systemctl restart bruteforce-lab
          echo "Deploy complete: $(python manage.py --version 2>/dev/null || true)"
          REMOTE

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
