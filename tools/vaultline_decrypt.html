<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaultline — AES-256 Decryptor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px;
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0d1117; color: #e6edf3;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 720px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h1 .g { background: linear-gradient(90deg,#7c3aed,#22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: #8b949e; margin: 0 0 20px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; font-size: .9rem; }
  textarea, input {
    width: 100%; background: #0d1117; color: #e6edf3;
    border: 1px solid #30363d; border-radius: 8px; padding: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem;
  }
  textarea { resize: vertical; min-height: 90px; }
  input { min-height: 40px; }
  button {
    margin-top: 14px; width: 100%; padding: 11px; border: 0; border-radius: 8px;
    background: linear-gradient(90deg,#7c3aed,#4f46e5); color: #fff;
    font-weight: 700; font-size: 1rem; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  .out { white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, monospace; font-size: .9rem; margin-top: 12px; }
  .ok { color: #3fb950; } .err { color: #f85149; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs button { width: auto; margin: 0; padding: 7px 14px; font-size: .85rem; background: #21262d; }
  .tabs button.active { background: linear-gradient(90deg,#7c3aed,#4f46e5); }
  .hint { color: #8b949e; font-size: .82rem; margin-top: 6px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Vaultline <span class="g">AES-256 Decryptor</span></h1>
  <p class="sub">Recover credentials leaked in <code>vaultline_data_export.json</code>. Runs entirely in your browser (AES-256, encode-decode.com compatible).</p>

  <div class="tabs">
    <button id="tab-json" class="active" onclick="showTab('json')">Paste the whole export</button>
    <button id="tab-single" onclick="showTab('single')">One blob + key</button>
  </div>

  <div class="card" id="pane-json">
    <label for="json">Paste the full contents of vaultline_data_export.json</label>
    <textarea id="json" placeholder='{ "account_key": "...", "account_blob": "...", "vault_key": "...", "vault_blob": "..." }'></textarea>
    <button onclick="runJson()">Decrypt everything</button>
    <div class="out" id="jsonOut"></div>
  </div>

  <div class="card" id="pane-single" hidden>
    <label for="blob">Ciphertext blob (starts with U2FsdGVk…)</label>
    <textarea id="blob" placeholder="U2FsdGVkX1..."></textarea>
    <label for="secret">Secret (the matching account_key or vault_key)</label>
    <input id="secret" placeholder="e.g. 7f99dce86d59acc8">
    <button onclick="runSingle()">Decrypt</button>
    <div class="out" id="singleOut"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script>
  function showTab(which) {
    document.getElementById('pane-json').hidden = which !== 'json';
    document.getElementById('pane-single').hidden = which !== 'single';
    document.getElementById('tab-json').classList.toggle('active', which === 'json');
    document.getElementById('tab-single').classList.toggle('active', which === 'single');
  }

  function decrypt(blob, secret) {
    // encode-decode.com scheme: key = secret zero-padded to 32 bytes, IV = zeros.
    let s = secret.trim();
    s = (s + '\0'.repeat(32)).substring(0, 32);
    const key = CryptoJS.enc.Utf8.parse(s);
    const iv = CryptoJS.enc.Hex.parse('00'.repeat(16));
    const cp = CryptoJS.lib.CipherParams.create({ ciphertext: CryptoJS.enc.Base64.parse(blob.trim()) });
    const txt = CryptoJS.AES.decrypt(cp, key, { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }).toString(CryptoJS.enc.Utf8);
    if (!txt) throw new Error('Empty result — wrong secret, or not a matching blob.');
    return txt;
  }

  function runSingle() {
    const out = document.getElementById('singleOut');
    try {
      const txt = decrypt(document.getElementById('blob').value, document.getElementById('secret').value);
      out.className = 'out ok';
      out.textContent = '✓ ' + txt;
    } catch (e) {
      out.className = 'out err';
      out.textContent = '✗ ' + e.message;
    }
  }

  function runJson() {
    const out = document.getElementById('jsonOut');
    let data;
    try {
      data = JSON.parse(document.getElementById('json').value);
    } catch (e) {
      out.className = 'out err';
      out.textContent = '✗ That is not valid JSON. Paste the whole file contents.';
      return;
    }
    const lines = [];
    const pairs = [
      ['Account', 'account_blob', 'account_key'],
      ['Vault',   'vault_blob',   'vault_key'],
    ];
    let anyOk = false;
    for (const [name, bk, kk] of pairs) {
      if (!data[bk] || !data[kk]) continue;
      try {
        lines.push('✓ ' + name + ': ' + decrypt(data[bk], data[kk]));
        anyOk = true;
      } catch (e) {
        lines.push('✗ ' + name + ': ' + e.message);
      }
    }
    if (!lines.length) lines.push('No account_blob/vault_blob fields found in that JSON.');
    out.className = 'out ' + (anyOk ? 'ok' : 'err');
    out.textContent = lines.join('\n');
  }
</script>
</body>
</html>
